services:
  api:
    image: benchmind:latest
    build:
      context: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file:
      - .env
    environment:
      BENCHMIND_API_TOKEN: ${BENCHMIND_API_TOKEN:?Set BENCHMIND_API_TOKEN in .env}
      BENCHMIND_REQUIRE_API_TOKEN: "true"
      BENCHMIND_VECTOR_DB_PATH: /app/.benchmind/chroma
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.40}
      HF_HOME: /app/.benchmind/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.benchmind/huggingface/sentence-transformers
    volumes:
      - ./.benchmind:/app/.benchmind
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: benchmind:latest
    build:
      context: .
    command: >-
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --server.fileWatcherType=none
    environment:
      BENCHMIND_API_URL: http://api:8000
      BENCHMIND_API_TOKEN: ${BENCHMIND_API_TOKEN:?Set BENCHMIND_API_TOKEN in .env}
      BENCHMIND_VECTOR_DB_PATH: /app/.benchmind/chroma
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.40}
      HF_HOME: /app/.benchmind/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.benchmind/huggingface/sentence-transformers
      STREAMLIT_THEME_BASE: light
      STREAMLIT_THEME_PRIMARY_COLOR: "#2563EB"
      STREAMLIT_THEME_BACKGROUND_COLOR: "#F6F7FB"
      STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR: "#FFFFFF"
      STREAMLIT_THEME_TEXT_COLOR: "#172033"
    volumes:
      - ./.benchmind:/app/.benchmind
    expose:
      - "8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      APP_AUTH_USER: ${APP_AUTH_USER:?Set APP_AUTH_USER in .env}
      APP_AUTH_PASSWORD_HASH: ${APP_AUTH_PASSWORD_HASH:?Set APP_AUTH_PASSWORD_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
